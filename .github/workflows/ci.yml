name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le code et les tests
        run: npm run check

      - name: Construire le site
        run: npm run build

      - name: Vérifier les vulnérabilités de production
        run: npm run audit:prod
